<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio1</title>
</head>

<body>

    <script>

        //Estos primeros los he hecho declarando la variable aparte
        let op1 = (20 == 20)
        let op2 = (20 === 20)
        let op3 = (20 === 20.0)
        let op4 = ("Juan" === "juan")

        document.write(`<p> La operación 20 == 20 es: ${op1}  </p>`)
        document.write(`<p> La operación 20 === 20 es: ${op2}  </p>`)
        document.write(`<p> La operación 20 === 20.0 es: ${op3}  </p>`)
        document.write(`<p> La operación "Juan" === "juan" es: ${op4}  </p>`)

        //estos los he hecho metiendolos con $ directamente
        document.write(`<p> La operación "Juan" > "juan" es: ${"Juan" > "juan"}  </p>`)
        document.write(`<p> La operación 20 == 20 es: ${"Juan" < "juan"}  </p>`)
        document.write(`<p> La operación "123" == 123 es: ${"123" == 123}  </p>`)
        document.write(`<p> La operación "123" === 123 es: ${"123" === 123}  </p>`)
        document.write(`<p> La operación parseInt("123") === 123 es: ${parseInt("123") === 123}  </p>`)

    </script>

</body>

</html>
