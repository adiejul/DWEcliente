<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>

<body>

    <script>
        var countdown = prompt("Introduce un número para iniciar la cuenta atrás");
        while (countdown > 0) {
            alert(countdown + "... ");
            countdown++;
        }
    </script>

    /*
    Dejando countdown-- va hacia atras
    Poniendo countdown++ va hacia adelante
    */

</body>

</html>
