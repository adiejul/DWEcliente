<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>
<body>

    <script>
        
        function divisible(num){

            if(num % 3 ===0){
                return "Es divisible"
            }else{
                return "No es divisible"
            }
        }

        let num= parseInt(prompt("Introduce un numero para saber si es divisible de 3: ")) 

        document.write(divisible(num))

    </script>
    
</body>
</html>
