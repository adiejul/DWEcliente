<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>
<body>

    <script>

        function sumEveryOther(...arg){
                
            let contador = 1;
            let suma = 0;
            
            for(let i = 0; i < arg.length; i++){

                if(contador % 2 !== 0){
                    suma += arg[i];
                }

                contador++;
            }

            return suma

        }

        document.write(sumEveryOther(5, 6, 3, 4, 1))

    </script>
    
</body>
</html>
