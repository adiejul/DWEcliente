<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>
<body>
    <script>
        
        let edad = parseInt(prompt("Introduce una edad: "))

        if(edad>=18)
            document.write("absoluto")
        else if(edad>=16)
            document.write("juvenil")
        else if(edad>=14)
            document.write("cadete")
        else if(edad>=12)
            document.write("infantil")
        else if(edad>=10)
            document.write("alevín")
        else if(edad>=8)
            document.write("benjamín")
        else
            document.write("No existe categoria")

    </script>
</body>
</html>
