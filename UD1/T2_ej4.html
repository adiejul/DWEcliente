<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
</head>
<body>
    
    <script>

        let hora = 8
        let minuto = "30"

        while (hora != 22){  

            if (minuto == "00"){

                minuto = "30"
                document.write(`${hora}:${minuto}<br>`)

            }else{

                hora += 1
                minuto = "00" 

                if (hora < 22)
                    document.write(`${hora}:${minuto}<br>`)
            }
        }

    </script>

</body>
</html>
