<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>
<body>

    <script>

        for(let i = 1; i <= 10; i++){
            document.write("<br>" + "Tabla del " + i + ": <br>")

            for(let x = 1; x <= 10; x++ ){
                let res = i*x
                document.write(i + "x" + x + "=" + res + "<br>")
            }
        }

    </script>
    
</body>
</html>
