<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7</title>
</head>

<body>

    <script>

        let columnas = parseInt(prompt("Introduce el numero de columnas: "));
        let filas = parseInt(prompt("Introduce el numero de filas: "));
        let alto = parseInt(prompt("Introduce la altura en pixels: "));
        let ancho = parseInt(prompt("Introduce la anchura en pixels: "));

        document.write(`<table border="0" cellspacing="2" bgcolor="black" width="200">`)

        for (let i = 1; i <= filas; i++) {
            document.write(`<tr bgcolor="white" height=${alto}>`)

            for (let x = 1; x <= columnas; x++) {
                document.write(`<td width=${ancho} > &nbsp; </td>`)
            }
            document.write(`</tr>`)
        }
        
        document.write(`</table>`)

    </script>


</body>

</html>
