<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
</head>
<body>
    <script>

        let r = prompt("Introduce el valor del radio: ");

        let volumen = (r) => (4/3)*Math.PI*(r*r*r)

        document.write("El volumen de una esfera es de : " + volumen(r).toFixed(2));

    </script>
    
</body>
</html>
