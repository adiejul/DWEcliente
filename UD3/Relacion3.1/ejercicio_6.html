<body>
    <script>
        
        

        const potencia = (base, exponente) =>{
            if (exponente === 0) return 1;

            return base * potencia(base, exponente -1)
        }

        let resultado = potencia(2,3)

        console.log("2 elevado a 3 es: " + resultado)

    </script>
