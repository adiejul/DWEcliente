<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
    <script>

        const arOperaciones = [];

        function poner0(arOperaciones) {
            for( let i = 0; i<10;i++){
                arOperaciones[i] = 0;
            }
        }

        function muestraAr(arOperaciones){
                document.write(arOperaciones.join(" ")+"<br>")
        }

        function poner1(arOperaciones){
            for( let i = 0; i<10;i++){
                arOperaciones[i] = 1;
            }
        }


        poner0(arOperaciones)
        muestraAr(arOperaciones)
        poner1(arOperaciones)
        muestraAr(arOperaciones)


        

        






    </script>

</body>

</html>
