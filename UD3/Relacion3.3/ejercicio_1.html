<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="modoAuxiliar.js"></script>
    <title>Ejercicio 1</title>
</head>

<body>
    <script>
        const arNumber = [3, 8, 1, 7, 4]
        let texto = "I'm a hacker now"
        let file = "enunciados.txt"
        const ar2D = [[1, 5, 3], [3, 10], [2, 5]]
        const arDuplicado = [5, 4, 3, 5, 4, 1]
        let str = "This is a really bad test"
        const arWords = ["really", "bad"]

        document.write("Array original: ", arNumber, "<br>")
        document.write("Array filtado: ", filterNumbersGreaterThan(arNumber, 7), "<br>")
        document.write("Texto modificado -hacker speak-: ", toHackerSpeak(texto), "<br>")
        document.write("La extension del archivo es: ", getFileExtension(file), "<br>")
        document.write("El array 'aplanado' es: ", flatArray(ar2D), "<br>")
        document.write("El array sin duplicados: ", removeDuplicates(arDuplicado), "<br>")
        document.write(`La letra 'a' aparece ${countLetter("a", texto)} veces <br>`)
        document.write(`La frase recortada: ${removeWords(str, arWords)} <br>`)








    </script>

</body>

</html>
