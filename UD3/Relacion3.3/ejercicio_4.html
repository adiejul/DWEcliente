<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
</head>

<body>
    <script>
        const clase = [
            "Angel Garcia, 20, 6, 7, 10",
            "Jose Sanchez, 22, 8, 9, 4",
            "Ana Karenina, 21, 5, 5, 5",
            "Lorena Santos, 19, 2, 7, 4"
        ];

        function nombreAzar() {

            let numero = Math.floor(Math.random() * (clase.length))

            return clase[numero].split(",")[0];

        }

        document.write(nombreAzar())


    </script>

</body>
