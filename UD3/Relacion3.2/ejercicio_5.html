<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>
<body>
    <script>

        let numerosAzar = [];

        for( let i = 0; i < 100; i++){
            numerosAzar.push(Math.floor(Math.random()*100 ));
        }

        let total= 0;
        
        for (const numero of numerosAzar) {
            total += numero   
        }

        document.write("El numero minimo es: "+ Math.min(...numerosAzar),"<br>");
        document.write("El numero maximo es: "+ Math.max(...numerosAzar),"<br>");
        document.write("La media es: "+ total/numerosAzar.length);

    </script>
    
</body>
</html>
