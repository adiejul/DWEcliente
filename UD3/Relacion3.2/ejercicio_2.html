<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    <script>
         let colores = ["azul", "amarillo", "rojo", "verde", "café", "rosa"];

         let busca = prompt("Introduce un color");

         let resultado = colores.find((a)=> a === busca);

         if(resultado) console.log(busca + " esta en el array colores")
        else console.log(busca + " no esta en el array colores")
    </script>
    
</body>
</html>
