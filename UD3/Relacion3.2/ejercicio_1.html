<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>

<body>
    <script>

        let arNumeros = [];

        for(let i = 0; i <5; i++){
            arNumeros.push(parseFloat(prompt(`Introduce el numero ${i+1} de 5`)))
        }

        let minimo = Math.min(...arNumeros);

        let maximo = Math.max(...arNumeros);

        let total = 0;

        for (const numero of arNumeros) {
            total += numero;
        }

        let medio = total / arNumeros.length;

        document.write("El minimo es: ", minimo, "<br>");
        document.write("El maximo es: " + maximo, "<br>");
        document.write("La media es: " + medio);

    </script>

</body>
</html>
