<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8</title>
</head>
<body>
    <script>

        let cadenaNombres = prompt(`Introduce varios nombres separados por "," `);

        let nombres = cadenaNombres.split(",");

        for (let i = 0; i < nombres.length; i++) {

            nombres[i] = nombres[i].trim();
        }

        nombres.sort();

        console.log(nombres);

    </script>
    
</body>
</html>
