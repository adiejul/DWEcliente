<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>

<body>

    <script>
        let n = parseInt(prompt("Introduce un numero: "))
        const fibonacci = n =>  (n < 3) ? 1:fibonacci(n-1)+ fibonacci(n-2);
            
        document.write("El resultado de fibonacci es: ",fibonacci(n))

    </script>

</body>

</html>
