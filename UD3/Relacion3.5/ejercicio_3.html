<body>

    <script>

        const arNumeros = [1,2,3,4,5]

        let sumaTotal = arNumeros.reduce((acumulador, numero) => {
            return acumulador + numero;
        }, 0);

        document.write("La suma total de los digitos en el array es: ",sumaTotal)

    </script>

</body>
