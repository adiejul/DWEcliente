<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>
<body>
    <script>

        function paresImpares(){

            const arNumeros = [];

            for (let i = 0; i < 100; i++){

                arNumeros.push(Math.floor(Math.random()*1000) +1);
            }

            const arNuevo =[];

            for (const numero of arNumeros) {

                if (numero % 2 === 0)
                    arNuevo.unshift(numero)
                else
                    arNuevo.push(numero)
                
            }
            document.write (`Array original : <br>${arNumeros.join(" - ")}<br>`);
            return arNuevo.join(" - ")
        }
        
        document.write (`Array modificado : <br>${paresImpares()}`);

    </script>
</body>
</html>
