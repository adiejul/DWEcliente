<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10</title>
</head>
<body>
    <script>
        function conteoVocales(){
            
            let frase = toLowerCase(prompt("Introduce la frase: "));
            let vocal = "aeiou";

            let contA = 0;
            let contE = 0;
            let contI = 0;
            let contO = 0;
            let contU = 0;

            for (let i = 0; i < frase.length; i++){
                if(vocal.includes(frase.charAt(i))){
                    if (frase.charAt(i) === "a") contA++;
                    else if (frase.charAt(i) === "e") contE++;
                    else if (frase.charAt(i) === "i") contI++;
                    else if (frase.charAt(i) === "o") contO++;
                    else  contU++;
                }
            }
            let mensaje= "La frase tiene: "+
                            contA + " letra a, "+
                            contE + " letra e, "+
                            contI + " letra i, "+
                            contO + " letra o, "+
                            contU + " letra u. "
            return mensaje;
        }

        document.write(conteoVocales());


    </script>
    
</body>
</html>
