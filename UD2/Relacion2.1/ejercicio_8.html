<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8</title>
</head>
<body>
    <script>

        function letraRepetida(){
        
            let frase = prompt("Introduce la frase: ")
            
            let cont = 0;

            for(let i = 0; i< frase.length; i++){
                if(frase.charAt(i) == "a"){
                    cont++;
                }
            }

            return "En la frase se repite " + cont + " veces";
        }

        document.write(letraRepetida());

    </script>
    
</body>
</html>
