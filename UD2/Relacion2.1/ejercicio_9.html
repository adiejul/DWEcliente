<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 9</title>
</head>
<body>
    <script>
        function sonVocales(){
            
            let frase = prompt("Introduce la frase: ")
            let cont = 0;
            let vocal = "aeiouAEIOU";

            for(let i = 0; i< frase.length; i++){
                if(vocal.includes(frase.charAt(i))){
                    cont++;
                }
            }

            return "En la frase hay " + cont + " vocales";

        }

        document.write(sonVocales());

    </script>
    
</body>
</html>
