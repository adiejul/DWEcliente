<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <script>
        
        let contador = 60;

        let interval = setInterval(function(){
            if (contador !== 0){
                document.write(contador + "<br>");
                contador --
            }else
            clearInterval(interval);
        }, 1000);
    
    </script>

</body>
</html>
