<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicio 1</title>
</head>

<body>

    <table border="1">

        <tr>
            <th colspan="2">Informacion del navegador cliente</th>
        </tr>
        <tr>
            <td>window.location.href</td>
            <td id="n1"></td>
        </tr>
        <tr>
            <td>window.location.hostname</td>
            <td id="n2"></td>
        </tr>
        <tr>
            <td>window.location.pathname</td>
            <td id="n3"></td>
        </tr>
        <tr>
            <td>window.location.protocol</td>
            <td id="n4"></td>
        </tr>
        <tr>
            <td>window.location.href</td>
            <td id="n5"></td>
        </tr>
        <tr>
            <td>navigator.cookieEnabled</td>
            <td id="n6"></td>
        </tr>
        <tr>
            <td>navigator.appCodeName</td>
            <td id="n7"></td>
        </tr>


    </table>


    <script>
                      
            document.getElementById("n1").innerHTML = window.location.href;
            document.getElementById("n2").innerHTML = window.location.hostname;
            document.getElementById("n3").innerHTML = window.location.pathname;
            document.getElementById("n4").innerHTML = window.location.protocol;
            document.getElementById("n5").innerHTML = window.location.href;
            document.getElementById("n6").innerHTML = navigator.cookieEnabled;
            document.getElementById("n7").innerHTML = navigator.appCodeName;

         
    </script>

</body>

</html>
