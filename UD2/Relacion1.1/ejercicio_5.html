<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>
<body>
    <script>
        function opciones(){
            let mensaje = "Introduce una opcion:\n"+
                            "1. Potencia\n" +
                            "2. Raiz\n" +
                            "3. Potencia\n" +
                            "4. Trigonometria\n" 
            let opc = parseInt(prompt(mensaje));
            
           return opc;
        }

        function potencia(){
            
            let base = parseInt(prompt("Introduce la base"))
            let exponente = parseInt(prompt("Introduce el exponente"))
            let resultado = base ** exponente;
            return "La potencia de " + base + " elevado a " + exponente + " es: " +resultado;
        }

        function raiz(){
            
            let num = parseInt(prompt("Introduce un numero"))
            return "La raiz de " + num + " es: " + Math.sqrt(num);
        }

        function redondeo(){
            
            let num = parseFloat(prompt("Introduce un numero decimal"))
            let round = Math.round(num);
            let alza = Math.ceil(num);
            let baja = Math.floor(num);
            let mensaje = "El numero " + num + " redondeado es: "+ round + "\n"+
                        "redondeado al alza es: " + alza + "\n"+
                        "redondeado a la baja es: " + baja;
            return mensaje;
        }

        let opc = opciones();

        switch (opc) {
            case 1:
                let resPotencia = potencia();
                alert( resPotencia);
                break;
        
            case 2:
                let resRaiz = raiz();
                alert( resRaiz);
                break;
        
            case 3:
                let resRedondeo = redondeo();
                alert( resRedondeo);

                break;
        }

    </script>
</body>
</html>
