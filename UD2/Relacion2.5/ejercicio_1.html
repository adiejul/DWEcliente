<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    
    <input type="button" value="crear ventana" onclick="crearVentana()">
    <input type="button" value="cerrar ventana" onclick="cerrarVentana()">

    <script>

        let nueva;

        function crearVentana(){
            texto = prompt("introduce un texto");
            nueva = window.open("","","width=500, height=400");
            nueva.moveTo(0,-1)
            nueva.document.write(texto);
        }

        function cerrarVentana(){
            nueva.close();
        }

    </script>
    
</body>
</html>
