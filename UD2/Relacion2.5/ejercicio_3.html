<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>

<body>
    <label onclick="abrirVentana()">Haz clic aquí</label>
    <script>

        function abrirVentana() {

            for (let i = 1; i <= 5; i++) {


                let nueva = window.open("", "", "width=350,height=350")
               
                nueva.document.write(`
                    <h3>ventana ${i}</h3>
                    <input type="button" value="Cerrar ventana" onclick="window.close()">
                `);

            }
        }

    </script>

</body>

</html>
